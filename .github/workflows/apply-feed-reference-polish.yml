name: Apply feed reference polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-feed-reference-polish.yml
      - scripts/apply_feed_reference_polish.py
      - scripts/apply_shift_readmore.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply UI patches
        run: |
          python3 scripts/apply_feed_reference_polish.py
          python3 scripts/apply_shift_readmore.py

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: align shift read-more with rendered text"
          git push origin HEAD:main
