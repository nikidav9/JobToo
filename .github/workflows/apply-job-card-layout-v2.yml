name: Apply job card layout v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-job-card-layout-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply layout patch
        run: python3 scripts/apply-job-card-layout-v2.py

      - name: Verify diff
        run: |
          git diff --check
          grep -q 'deckFloatingActions' 'app/(tabs)/feed.tsx'
          grep -q 'primaryAction' 'components/ui/TabHeader.tsx'
          grep -q 'Вернуть предыдущую вакансию' 'app/(tabs)/feed.tsx'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx' 'components/ui/TabHeader.tsx'
          git commit -m "feat: refine permanent job card swipe layout"
          git push origin HEAD:main

# trigger
