name: Apply regular partner feed v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-regular-partner-feed-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/apply_regular_partner_feed.py
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show partner vacancies in regular side jobs"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
