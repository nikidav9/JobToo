name: Apply regular and trudvsem fix

on:
  push:
    branches: [main]

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'chore: apply regular and trudvsem fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: python3 scripts/fix_regular_trudvsem.py
      - run: git diff --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx' php-proxy/trudvsem.php
          git commit -m "fix: exclude Arbihunter from regular and align cards" || exit 0
          git push origin main
