name: Apply resilience source changes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-resilience-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply source patch
        run: |
          python3 scripts/apply_web_resilience_fix.py
          git checkout -- .github/workflows/deploy-regru.yml
      - name: Validate
        run: |
          git diff --check
          npm ci
          npm run lint
          npm run typecheck
          node --check public/sw.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'public/sw.js' 'app/(tabs)/feed.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: refresh web shell safely and fix hook order"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
