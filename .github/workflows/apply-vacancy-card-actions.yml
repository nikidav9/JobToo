name: Apply vacancy card actions update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-vacancy-card-actions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 scripts/apply-vacancy-card-actions.py

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'deckUtilityActions' 'app/(tabs)/feed.tsx'
          grep -q 'accessibilityLabel="Поделиться вакансией"' 'app/(tabs)/feed.tsx'
          grep -q 'Добавить в избранное' 'app/(tabs)/feed.tsx'

      - name: Commit to main
        run: |
          if git diff --quiet -- 'app/(tabs)/feed.tsx'; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          git commit -m "feat: add save and share actions to job cards"
          git push origin HEAD:main
