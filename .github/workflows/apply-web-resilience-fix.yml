name: Apply web resilience fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-web-resilience-fix.yml
      - scripts/apply_web_resilience_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply resilience patch
        run: python3 scripts/apply_web_resilience_fix.py

      - name: Check diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Service worker syntax
        run: node --check public/sw.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '.github/workflows/deploy-regru.yml' 'public/sw.js' 'app/(tabs)/feed.tsx'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: serve web assets from origin and refresh shell safely"
          git push origin HEAD:main
