name: Auto-merge PR (prefer PR changes)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge'
        required: true
        # `number` GitHub передаёт в shell как float (`9.0`), а ref pull/9.0
        # не существует. Строка сохраняет номер PR ровно в введённом виде.
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR branch
        run: |
          PR_RAW='${{ github.event.inputs.pr_number }}'
          PR=${PR_RAW%.0}
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "Некорректный номер PR: $PR_RAW"; exit 1; }
          git fetch origin pull/${PR}/head:pr-${PR}

      - name: Merge PR into main (prefer PR changes)
        env:
          TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          set -e
          PR_RAW='${{ github.event.inputs.pr_number }}'
          PR=${PR_RAW%.0}
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "Некорректный номер PR: $PR_RAW"; exit 1; }
          git checkout main
          git pull origin main
          # Try automatic merge preferring PR changes for conflicts
          if git merge --no-ff pr-${PR} -X theirs -m "Merge PR #${PR} — auto-merged preferring PR changes"; then
            echo "Auto-merge succeeded"
          else
            echo "Auto-merge failed due to conflicts"
            # Log conflicting files for inspection
            git status --porcelain
            git diff --name-only --diff-filter=U || true
            exit 1
          fi

      - name: Push merged main
        env:
          TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          git push https://x-access-token:${{ secrets.MERGE_TOKEN }}@github.com/${{ github.repository }} main

      - name: Mark PR merged via API
        env:
          TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          PR_RAW='${{ github.event.inputs.pr_number }}'
          PR=${PR_RAW%.0}
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "Некорректный номер PR: $PR_RAW"; exit 1; }
          curl -s -X PUT \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR}/merge" \
            -d '{"commit_title": "Merge PR #'${PR}' — merged by workflow", "merge_method":"merge"}'
