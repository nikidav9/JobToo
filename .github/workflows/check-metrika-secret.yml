name: Проверка секрета Метрики

# Разовая проверка: на месте ли YANDEX_METRIKA_TOKEN и работает ли он из сборки.
# Токен наружу не печатается — только длина и результат обращения к API.
# Удаляется после проверки.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Секрет и доступ к Метрике
        env:
          YM: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          if [ -z "$YM" ]; then
            echo "СЕКРЕТ НЕ НАЙДЕН: YANDEX_METRIKA_TOKEN пуст или назван иначе"
            exit 1
          fi
          echo "секрет на месте, длина ${#YM} символов"
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' -m 25 \
            -H "Authorization: OAuth $YM" \
            "https://api-metrika.yandex.net/stat/v1/data?ids=109805381&metrics=ym:s:visits&date1=yesterday&date2=yesterday")
          echo "ответ API: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "тело ответа:"; head -c 300 /tmp/r.json; exit 1
          fi
          python3 -c "import json;print('визитов вчера:', int(json.load(open('/tmp/r.json'))['totals'][0]))"
