name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vacancy-card-patch:
    name: Apply vacancy card UI patch
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch permanent vacancy cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/(tabs)/feed.tsx')
          src = path.read_text()

          card_old = """                  <SourceBadge partnerName={isExternal ? (sourceName ?? 'Партнёр') : undefined} />
                </View>

                <Text style={styles.jobTitle} numberOfLines={2}>{v.title}</Text>"""
          card_new = """                  <SourceBadge partnerName={isExternal ? (sourceName ?? 'Партнёр') : undefined} />
                </View>

                {!isExternal ? (
                  <View style={pS.deckUtilityActions}>
                    <TouchableOpacity
                      accessibilityLabel=\"Поделиться вакансией\"
                      style={pS.deckUtilityBtn}
                      onPress={() => { void shareVacancy(v as PermVacancy); }}
                      activeOpacity={0.75}
                    >
                      <Ionicons name=\"share-outline\" size={18} color={Colors.textSecondary} />
                    </TouchableOpacity>
                    <TouchableOpacity
                      accessibilityLabel={permSavedIds.includes(v.id) ? 'Удалить из избранного' : 'Добавить в избранное'}
                      style={[pS.deckUtilityBtn, permSavedIds.includes(v.id) && pS.deckUtilityBtnSaved]}
                      onPress={() => toggleSaved(v as PermVacancy)}
                      activeOpacity={0.75}
                    >
                      <Ionicons
                        name={permSavedIds.includes(v.id) ? 'heart' : 'heart-outline'}
                        size={18}
                        color={permSavedIds.includes(v.id) ? Colors.red : Colors.textSecondary}
                      />
                    </TouchableOpacity>
                  </View>
                ) : null}

                <Text style={styles.jobTitle} numberOfLines={2}>{v.title}</Text>"""
          if 'deckUtilityActions' not in src:
              if src.count(card_old) != 1:
                  raise SystemExit(f'card anchor count: {src.count(card_old)}')
              src = src.replace(card_old, card_new)

          tabs_old = """  tabChipsScroll: {
    flex: 1, flexShrink: 1, alignSelf: 'stretch',
  },
  tabChipsRow: {
    flexDirection: 'row', gap: rs(8),
    paddingHorizontal: rs(16), paddingVertical: rs(10),
  },
  tabChip: {
    flexDirection: 'row', alignItems: 'center', gap: rs(5),
    borderRadius: rs(100), paddingHorizontal: rs(12), paddingVertical: rs(8),
    borderWidth: 1.5, borderColor: Colors.inputBorder,
    backgroundColor: Colors.bg, flexShrink: 0,
  },
  tabChipActive: { borderColor: Colors.primary, backgroundColor: Colors.primaryLight },
  tabChipTxt: { fontSize: rf(13), fontWeight: '500', color: Colors.textSecondary },
  tabChipTxtActive: { color: Colors.primary, fontWeight: '700' },
  tabChipCount: { fontSize: rf(13), fontWeight: '600', color: Colors.textMuted },
  tabChipCountActive: { color: Colors.primary },"""
          tabs_new = """  tabChipsScroll: {
    flex: 1, flexShrink: 1, alignSelf: 'stretch', minWidth: 0,
  },
  tabChipsRow: {
    flexGrow: 1, flexDirection: 'row', gap: rs(6),
    paddingLeft: rs(12), paddingVertical: rs(10),
  },
  tabChip: {
    flex: 1, minWidth: 0,
    flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: rs(4),
    borderRadius: rs(100), paddingHorizontal: rs(8), paddingVertical: rs(8),
    borderWidth: 1.5, borderColor: Colors.inputBorder,
    backgroundColor: Colors.bg,
  },
  tabChipActive: { borderColor: Colors.primary, backgroundColor: Colors.primaryLight },
  tabChipTxt: { fontSize: rf(12.5), fontWeight: '500', color: Colors.textSecondary, flexShrink: 1 },
  tabChipTxtActive: { color: Colors.primary, fontWeight: '700' },
  tabChipCount: { fontSize: rf(12.5), fontWeight: '600', color: Colors.textMuted, flexShrink: 0 },
  tabChipCountActive: { color: Colors.primary },
  deckUtilityActions: {
    flexDirection: 'row', alignItems: 'center', justifyContent: 'flex-end', gap: rs(8),
    marginTop: rs(-2),
  },
  deckUtilityBtn: {
    width: rs(38), height: rs(38), borderRadius: rs(12),
    borderWidth: 1, borderColor: Colors.divider, backgroundColor: Colors.surface,
    alignItems: 'center', justifyContent: 'center',
  },
  deckUtilityBtnSaved: { borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' },"""
          if "tabChipsScroll: {\n    flex: 1, flexShrink: 1, alignSelf: 'stretch', minWidth: 0," not in src:
              if src.count(tabs_old) != 1:
                  raise SystemExit(f'tab styles anchor count: {src.count(tabs_old)}')
              src = src.replace(tabs_old, tabs_new)

          path.write_text(src)
          PY

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'deckUtilityActions' 'app/(tabs)/feed.tsx'
          grep -q 'accessibilityLabel="Поделиться вакансией"' 'app/(tabs)/feed.tsx'
          grep -q 'Добавить в избранное' 'app/(tabs)/feed.tsx'

      - name: Commit patch
        run: |
          if git diff --quiet -- 'app/(tabs)/feed.tsx'; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          git commit -m "feat: add save and share actions to job cards"
          git push origin HEAD:main

  app:
    name: App, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PHP syntax
        run: find php-proxy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Partner gateway state machine
        run: php tests/partner_core_test.php
      - name: Isolated partner sandbox flow
        run: php tests/partner_sandbox_e2e_test.php

      - name: Service worker and infrastructure syntax
        run: |
          node --check public/sw.js
          bash -n infra/bootstrap.sh
          find infra -maxdepth 1 -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          EXPO_PUBLIC_DASHBOARD_URL: https://example.invalid
        run: npx expo export --platform web --max-workers 2

      - name: Verify complete app shell
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('src', 'href'):
                      value = values.get(key, '')
                      if value.startswith('/_expo/static/') or value.startswith('/assets/'):
                          self.urls.append(urlparse(value).path.lstrip('/'))

          root = Path('dist')
          html = (root / 'index.html').read_text()
          parser = Assets()
          parser.feed(html)
          missing = [url for url in parser.urls if not (root / url).is_file()]
          if not parser.urls:
              raise SystemExit('index.html has no app assets')
          if missing:
              raise SystemExit('missing app assets: ' + ', '.join(missing))
          print(f'complete shell: {len(parser.urls)} referenced assets')
          PY

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: npm run build
