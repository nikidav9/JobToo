name: Daily Nudges

# Напоминания директорам о заявках + периодические подталкивания.
# Файл переопубликован для перерегистрации расписания в GitHub.
on:
  schedule:
    # 07:00 UTC = 10:00 МСК, каждый день
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  nudges:
    name: Reminders and nudges
    runs-on: ubuntu-latest
    steps:
      - name: Call cronDailyNudges
        env:
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          SECRET="$APP_SECRET"
          [ -n "$SECRET" ] || { echo "Не задан секрет EXPO_PUBLIC_APP_SECRET"; exit 1; }
          RESP=$(curl -s -X POST "https://jobtoo.ru/api/db.php" \
            -H "Content-Type: application/json" \
            -H "X-App-Secret: $SECRET" \
            -d '{"fn":"cronDailyNudges","args":[]}')
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"data"' || { echo "cronDailyNudges failed"; exit 1; }
