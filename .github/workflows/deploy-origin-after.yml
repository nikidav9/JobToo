name: Publish same-origin web build

on:
  workflow_run:
    workflows: ["Сборка сайта и доставка на московский сервер"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build same-origin web
        run: npx expo export --platform web --max-workers 2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          EXPO_PUBLIC_DASHBOARD_URL: https://admin.jobtoo.ru
          EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_KEY }}
      - run: cp assets/images/favicon.ico dist/favicon.ico
      - name: Reject Timeweb CDN references
        run: |
          if grep -R "j8a6jds2at.cdn.twcstorage.ru" dist --include='*.html'; then
            exit 1
          fi
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf pack && mkdir pack
          cp -a dist/. pack/
          rm -rf pack/api pack/.htaccess
          tar -czf dist.tar.gz -C pack .
          gh release view web >/dev/null 2>&1 || gh release create web --latest=false -t "Веб-сборка"
          gh release upload web dist.tar.gz --clobber
