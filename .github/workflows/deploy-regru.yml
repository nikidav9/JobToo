name: Сборка сайта и доставка на московский сервер

on:
  push:
    branches: [main]
  # Ручной запуск: пригодится, когда меняются не файлы, а секреты — тогда
  # выкладку надо повторить, а коммитить нечего.
  workflow_dispatch:

jobs:
  deploy:
    name: Сборка и доставка
    runs-on: ubuntu-latest
    # Нужно, чтобы выложить собранный сайт выпуском — его забирает московский сервер.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Что из настроек репозитория реально доехало до сборки.
      #
      # Значения не печатаем — только длину. Сегодня выяснилось, что ключ
      # считался заданным, а в собранной версии его не было вовсе: живые
      # обновления и загрузка файлов молча не работали месяцами. Отличить
      # «вписал» от «доехало» по самим настройкам невозможно, а по этой
      # строке — за две секунды.
      - name: Which build secrets arrived
        env:
          U: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          K: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          A: ${{ secrets.EXPO_PUBLIC_API_URL }}
          S: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          say() { [ -n "$2" ] && echo "$1: задан, ${#2} символов" || echo "$1: ПУСТО"; }
          say EXPO_PUBLIC_SUPABASE_URL      "$U"
          say EXPO_PUBLIC_SUPABASE_ANON_KEY "$K"
          say EXPO_PUBLIC_API_URL           "$A"
          say EXPO_PUBLIC_APP_SECRET        "$S"
          # Адрес не секрет — его показываем целиком: по нему сразу видно,
          # смотрит сборка на облако или на свой сервер.
          echo "адрес бэкенда: ${U:-нет}"

      - name: Build Expo web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          # Не секрет и никогда им не был — обычный публичный адрес. В
          # настройках он указывал на Vercel, и одна забытая строка там
          # утянула бы приложение обратно на чужой хостинг.
          EXPO_PUBLIC_DASHBOARD_URL: https://admin.jobtoo.ru
          EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_KEY }}

      # Раньше здесь же PHP прокси копировался в dist/api/ и уезжал по FTP на
      # Reg.ru. Хостинга больше нет, а в выпуск для Москвы каталог api/ и так
      # не попадает — его вырезают ниже. PHP на московский сервер приходит
      # прямо из репозитория, в /opt/jobtoo-proxy (см. infra/bootstrap.sh).
      #
      # Значок остаётся: он лежит в корне сборки и в выпуск попадает.
      - name: Replace favicon
        run: cp assets/images/favicon.ico dist/favicon.ico

      # Здесь же собирались файлы секретов для Reg.ru: app_secrets.php,
      # sb_url.php, sb_service_key.php, admin_credentials.php. Они клались в
      # dist/api/ и уезжали по FTP. Хостинга больше нет, а в выпуск для
      # Москвы каталог api/ не попадает — то есть шаг писал файлы, которые
      # никто не забирал, и делал это с настоящими паролями.
      #
      # На московский сервер секреты уходят ниже, шагом «Deliver secrets»:
      # не файлами в сборке, а отдельным запросом к deploy.php.

      - name: Inject Yandex Metrika into index.html
        run: |
          python3 - <<'PYEOF'
          metrika = """<!-- Yandex.Metrika counter --><script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,"script","https://mc.yandex.ru/metrika/tag.js?id=109805381","ym");ym(109805381,"init",{ssr:true,webvisor:true,clickmap:true,ecommerce:"dataLayer",referrer:document.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});</script><noscript><div><img src="https://mc.yandex.ru/watch/109805381" style="position:absolute;left:-9999px;" alt=""/></div></noscript><!-- /Yandex.Metrika counter -->"""
          with open("dist/index.html", "r") as f:
              html = f.read()
          html = html.replace("</head>", metrika + "</head>", 1)
          with open("dist/index.html", "w") as f:
              f.write(html)
          print("Metrika injected OK")
          PYEOF

      # Секреты — на московский сервер.
      #
      # Ни FTP, ни ssh туда нет, и заводить их значит класть ключ от машины в
      # настройки репозитория. Поэтому отдельный запрос к deploy.php: сервер
      # сам раскладывает пришедшее по файлам. Первый раз пропуск приложения
      # пришлось нести руками, разовой формой, и повторять это при каждой
      # смене пароля — верный способ однажды забыть.
      #
      # Адрес по IP, а не по имени: канал заводился, когда jobtoo.ru ещё
      # указывал на Reg.ru. Менять работающую доставку без нужды не стоит.
      #
      # Токен не задан — шаг пропускается: значит канал ещё не заведён, и
      # выкладка не должна из-за этого падать.
      - name: Deliver secrets to the Moscow server
        env:
          JT_DEPLOY_TOKEN: ${{ secrets.JT_DEPLOY_TOKEN }}
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          APP_SECRET_PREV: ${{ secrets.APP_SECRET_PREV }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          DASHBOARD_LOGIN: ${{ secrets.DASHBOARD_LOGIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          STUDIO_LOGIN: ${{ secrets.STUDIO_LOGIN }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_KEY: ${{ secrets.BACKUP_S3_KEY }}
          BACKUP_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET }}
        run: |
          if [ -z "$JT_DEPLOY_TOKEN" ]; then
            echo "JT_DEPLOY_TOKEN не задан — пропускаю доставку"
            exit 0
          fi
          python3 - > payload.json <<'PY'
          import json, os
          e = os.environ.get
          print(json.dumps({
              "app": {
                  "APP_SECRET":      e("APP_SECRET", ""),
                  "APP_SECRET_PREV": e("APP_SECRET_PREV", ""),
                  "TG_BOT_TOKEN":    e("TG_BOT_TOKEN", ""),
              },
              "admin": {
                  "login":    e("DASHBOARD_LOGIN", ""),
                  "password": e("DASHBOARD_PASSWORD", ""),
              },
              # Вход в панель базы. Пустое — сервер оставит прежний пароль.
              "studio": {
                  "login":    e("STUDIO_LOGIN", ""),
                  "password": e("STUDIO_PASSWORD", ""),
              },
              # Чтение репозитория. Нужен, только если его закроют.
              "github": { "token": e("GH_READ_TOKEN", "") },
              # Второй адрес хранения копий. Пустое — сервер оставит прежнее.
              "backup": {
                  "endpoint": e("BACKUP_S3_ENDPOINT", ""),
                  "bucket":   e("BACKUP_S3_BUCKET", ""),
                  "key":      e("BACKUP_S3_KEY", ""),
                  "secret":   e("BACKUP_S3_SECRET", ""),
              },
          }))
          PY
          code=$(curl -sS -o resp.json -w '%{http_code}' -m 60 \
            -H "X-Deploy-Token: $JT_DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            https://147.45.184.99.sslip.io/api/deploy.php)
          echo "ответ $code: $(cat resp.json)"
          rm -f payload.json resp.json
          [ "$code" = "200" ]

      # Тот же сайт — для московского сервера.
      #
      # Туда нет ни FTP, ни ssh, и заводить их значит класть ключ в настройки
      # репозитория. Поэтому наоборот: сервер забирает сборку сам, как он уже
      # забирает infra/. Выпуск с постоянной меткой web — чтобы адрес не
      # менялся, а в репозитории не копилась история сборок.
      #
      # Каталог api/ выбрасываем: PHP и секреты на сервере свои, из
      # /opt/jobtoo-proxy. Иначе собранные здесь пароли уехали бы в выпуск,
      # открытый всем.
      - name: Publish web build for the Moscow server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf pack && mkdir pack
          cp -a dist/. pack/
          rm -rf pack/api pack/.htaccess
          tar -czf dist.tar.gz -C pack .
          ls -l dist.tar.gz
          gh release view web >/dev/null 2>&1 \
            || gh release create web --latest=false \
                 -t "Веб-сборка" \
                 -n "Собирается автоматически. Московский сервер забирает отсюда dist.tar.gz."
          gh release upload web dist.tar.gz --clobber

      # Выкладки по FTP на Reg.ru здесь больше нет.
      #
      # 17 августа 2026 домен jobtoo.ru переехал на универсальные серверы имён,
      # и все записи теперь указывают на московский сервер. На хостинг Reg.ru
      # не приходит ни один запрос, а сам хостинг отключается.
      #
      # Шаг оставался бы последним и падал бы после отключения — доставка в
      # Москву проходит выше и не пострадала бы, но красная сборка мешает
      # заметить настоящую поломку.
      #
      # Секреты REGRU_FTP_HOST, REGRU_FTP_USER и REGRU_FTP_PASSWORD в
      # настройках репозитория больше не нужны — их стоит удалить.
