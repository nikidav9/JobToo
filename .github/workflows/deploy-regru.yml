name: Deploy to Reg.ru (jobtoo.ru)

on:
  push:
    branches: [main]
  # Ручной запуск: пригодится, когда меняются не файлы, а секреты — тогда
  # выкладку надо повторить, а коммитить нечего.
  workflow_dispatch:

jobs:
  deploy:
    name: Build web + FTP deploy
    runs-on: ubuntu-latest
    # Нужно, чтобы выложить собранный сайт выпуском — его забирает московский сервер.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          EXPO_PUBLIC_DASHBOARD_URL: ${{ secrets.EXPO_PUBLIC_DASHBOARD_URL }}
          EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_KEY }}

      - name: Copy PHP proxy and replace favicon
        run: |
          mkdir -p dist/api
          cp php-proxy/db.php dist/api/db.php
          cp php-proxy/tg.php dist/api/tg.php
          cp php-proxy/admin.php dist/api/admin.php
          cp php-proxy/tgtool.php dist/api/tgtool.php
          # База знаний бота и список станций к ней — их подключает tg.php
          cp php-proxy/bot_brain.php dist/api/bot_brain.php
          cp php-proxy/metro_stations.php dist/api/metro_stations.php
          cp assets/images/favicon.ico dist/favicon.ico
          cp public/.htaccess dist/.htaccess
          # Явно, не полагаясь на копирование public/: без этого файла
          # проверка владения доменом не доходит до московского сервера.
          mkdir -p dist/.well-known/acme-challenge
          cp public/.well-known/acme-challenge/.htaccess dist/.well-known/acme-challenge/.htaccess

      # Секреты в репозитории не лежат, поэтому файлы для них собираем здесь
      # из GitHub Secrets. Значения кладём в base64: пароль может содержать
      # кавычки и слэши, а так экранировать нечего.
      # Секрет не задан — файл не создаём: тот, что уже лежит на хостинге,
      # остаётся нетронутым (выкладка ничего лишнего не удаляет).
      - name: Write server secrets
        env:
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
          SB_URL: ${{ secrets.SB_URL }}
          DASHBOARD_LOGIN: ${{ secrets.DASHBOARD_LOGIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          APP_SECRET_PREV: ${{ secrets.APP_SECRET_PREV }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          # app_secrets.php: пропуск к db.php и токен бота.
          # Собираем, если задан хотя бы один. Незаданные попадут пустыми, и
          # соответствующая часть просто не работает: запасных значений в коде
          # больше нет — забытый там ключ пережил бы любую смену секретов.
          if [ -n "$APP_SECRET$APP_SECRET_PREV$TG_BOT_TOKEN" ]; then
            A=$(printf '%s' "$APP_SECRET"         | base64 -w0)
            R=$(printf '%s' "$APP_SECRET_PREV"    | base64 -w0)
            T=$(printf '%s' "$TG_BOT_TOKEN"       | base64 -w0)
            printf "<?php return ['APP_SECRET' => base64_decode('%s'), 'APP_SECRET_PREV' => base64_decode('%s'), 'TG_BOT_TOKEN' => base64_decode('%s')];\n" \
              "$A" "$R" "$T" > dist/api/app_secrets.php
            echo "app_secrets.php: собран"
          else
            echo "app_secrets.php: секреты не заданы, пропускаю"
          fi

          # Адрес бэкенда. Не задан — работает облако: выкладка сама по себе
          # ничего не переключает. Смена этого секрета и есть переключение,
          # а его очистка — откат.
          if [ -n "$SB_URL" ]; then
            U=$(printf '%s' "$SB_URL" | base64 -w0)
            printf "<?php return base64_decode('%s');\n" "$U" > dist/api/sb_url.php
            echo "sb_url.php: собран"
          else
            echo "sb_url.php: секрет SB_URL не задан, останемся на облаке"
          fi

          if [ -n "$SB_SERVICE_KEY" ]; then
            B=$(printf '%s' "$SB_SERVICE_KEY" | base64 -w0)
            printf "<?php return base64_decode('%s');\n" "$B" > dist/api/sb_service_key.php
            echo "sb_service_key.php: собран"
          else
            echo "sb_service_key.php: секрет SB_SERVICE_KEY не задан, пропускаю"
          fi

          if [ -n "$DASHBOARD_LOGIN" ] && [ -n "$DASHBOARD_PASSWORD" ]; then
            L=$(printf '%s' "$DASHBOARD_LOGIN" | base64 -w0)
            P=$(printf '%s' "$DASHBOARD_PASSWORD" | base64 -w0)
            printf "<?php return ['login' => base64_decode('%s'), 'password' => base64_decode('%s')];\n" "$L" "$P" > dist/api/admin_credentials.php
            echo "admin_credentials.php: собран"
          else
            echo "admin_credentials.php: секреты не заданы, пропускаю"
          fi

      - name: Inject Yandex Metrika into index.html
        run: |
          python3 - <<'PYEOF'
          metrika = """<!-- Yandex.Metrika counter --><script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,"script","https://mc.yandex.ru/metrika/tag.js?id=109805381","ym");ym(109805381,"init",{ssr:true,webvisor:true,clickmap:true,ecommerce:"dataLayer",referrer:document.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});</script><noscript><div><img src="https://mc.yandex.ru/watch/109805381" style="position:absolute;left:-9999px;" alt=""/></div></noscript><!-- /Yandex.Metrika counter -->"""
          with open("dist/index.html", "r") as f:
              html = f.read()
          html = html.replace("</head>", metrika + "</head>", 1)
          with open("dist/index.html", "w") as f:
              f.write(html)
          print("Metrika injected OK")
          PYEOF

      # Те же секреты — на московский сервер.
      #
      # На Reg.ru они уезжают файлами по FTP. Туда FTP нет, и первый раз
      # пропуск приложения пришлось нести руками, разовой формой. Повторять
      # это при каждой смене пароля — верный способ однажды забыть.
      #
      # Токен не задан — шаг пропускается: значит канал ещё не заведён, и
      # выкладка не должна из-за этого падать.
      - name: Deliver secrets to the Moscow server
        env:
          JT_DEPLOY_TOKEN: ${{ secrets.JT_DEPLOY_TOKEN }}
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          APP_SECRET_PREV: ${{ secrets.APP_SECRET_PREV }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          DASHBOARD_LOGIN: ${{ secrets.DASHBOARD_LOGIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$JT_DEPLOY_TOKEN" ]; then
            echo "JT_DEPLOY_TOKEN не задан — пропускаю доставку"
            exit 0
          fi
          python3 - > payload.json <<'PY'
          import json, os
          e = os.environ.get
          print(json.dumps({
              "app": {
                  "APP_SECRET":      e("APP_SECRET", ""),
                  "APP_SECRET_PREV": e("APP_SECRET_PREV", ""),
                  "TG_BOT_TOKEN":    e("TG_BOT_TOKEN", ""),
              },
              "admin": {
                  "login":    e("DASHBOARD_LOGIN", ""),
                  "password": e("DASHBOARD_PASSWORD", ""),
              },
          }))
          PY
          code=$(curl -sS -o resp.json -w '%{http_code}' -m 60 \
            -H "X-Deploy-Token: $JT_DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            https://147.45.184.99.sslip.io/api/deploy.php)
          echo "ответ $code: $(cat resp.json)"
          rm -f payload.json resp.json
          [ "$code" = "200" ]

      # Тот же сайт — для московского сервера.
      #
      # Туда нет ни FTP, ни ssh, и заводить их значит класть ключ в настройки
      # репозитория. Поэтому наоборот: сервер забирает сборку сам, как он уже
      # забирает infra/. Выпуск с постоянной меткой web — чтобы адрес не
      # менялся, а в репозитории не копилась история сборок.
      #
      # Каталог api/ выбрасываем: PHP и секреты на сервере свои, из
      # /opt/jobtoo-proxy. Иначе собранные здесь пароли уехали бы в выпуск,
      # открытый всем.
      - name: Publish web build for the Moscow server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf pack && mkdir pack
          cp -a dist/. pack/
          rm -rf pack/api pack/.htaccess
          tar -czf dist.tar.gz -C pack .
          ls -l dist.tar.gz
          gh release view web >/dev/null 2>&1 \
            || gh release create web --latest=false \
                 -t "Веб-сборка" \
                 -n "Собирается автоматически. Московский сервер забирает отсюда dist.tar.gz."
          gh release upload web dist.tar.gz --clobber

      - name: Deploy to Reg.ru via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.REGRU_FTP_HOST }}
          username: ${{ secrets.REGRU_FTP_USER }}
          password: ${{ secrets.REGRU_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/jobtoo.ru/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
