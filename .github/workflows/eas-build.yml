name: EAS Build

# Нативная сборка запускается вручную. Нужна только тогда, когда меняется то,
# что нельзя доставить OTA-обновлением: разрешения, конфиг-плагины, нативные
# модули, иконка и сплэш.
on:
  # Запуск тегом: push тега build-* стартует сборку обеих платформ.
  # Нужен потому, что запустить workflow_dispatch может не всякая интеграция.
  push:
    tags: ['build-*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]

jobs:
  build:
    name: Build ${{ inputs.platform || 'all' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Секретный ключ Supabase в eas.json не хранится (репозиторий чист).
      # Подставляем его сюда из GitHub Secrets прямо перед сборкой: файл eas.json
      # уезжает на серверы EAS, поэтому значение должно попасть именно в него, а
      # не в окружение раннера. Без ключа живой чат и загрузка файлов не работают.
      - name: Inject Supabase key into eas.json
        env:
          ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::Секрет EXPO_PUBLIC_SUPABASE_ANON_KEY пуст. Добавьте его в Settings → Secrets → Actions."
            exit 1
          fi
          tmp=$(mktemp)
          jq --arg k "$ANON_KEY" \
            '.build.production.env.EXPO_PUBLIC_SUPABASE_ANON_KEY = $k' eas.json > "$tmp"
          mv "$tmp" eas.json
          echo "Ключ Supabase подставлен в eas.json на время сборки (в гит не коммитится)."

      # Платформы собираем отдельными шагами: iOS требует сертификата
      # распространения, и раньше его отсутствие обрывало весь запуск —
      # вместе с уже готовой сборкой Android.
      - name: Build Android
        if: ${{ (inputs.platform || 'all') != 'ios' }}
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Build iOS
        # Не валим весь запуск: сертификат iOS настраивается интерактивно,
        # один раз (eas build -p ios локально либо через expo.dev → Credentials)
        continue-on-error: true
        if: ${{ (inputs.platform || 'all') != 'android' }}
        run: eas build --platform ios --profile production --non-interactive --no-wait
