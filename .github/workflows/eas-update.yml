name: EAS Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    name: OTA Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply vacancy card UI patch
        run: |
          python3 scripts/apply-vacancy-card-actions.py
          git diff --check
          if ! git diff --quiet -- 'app/(tabs)/feed.tsx'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'app/(tabs)/feed.tsx'
            git commit -m "feat: add save and share actions to job cards"
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          # Не секрет и никогда им не был — обычный публичный адрес. В
          # настройках он указывал на Vercel, и одна забытая строка там
          # утянула бы приложение обратно на чужой хостинг.
          EXPO_PUBLIC_DASHBOARD_URL: https://admin.jobtoo.ru
          EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_KEY }}
        run: |
          SAFE_MSG=$(echo "$COMMIT_MSG" | head -1 | cut -c1-100)
          eas update --channel production --message "$SAFE_MSG" --non-interactive
