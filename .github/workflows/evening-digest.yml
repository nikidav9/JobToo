name: Evening Digest

# Вечерний дайджест смен на завтра в группу. Спящее условие внутри
# cronEveningDigest: постит только при 3+ сменах от 2+ лавок.
on:
  schedule:
    # 16:00 UTC = 19:00 МСК, каждый день
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  digest:
    name: Post tomorrow shifts digest
    runs-on: ubuntu-latest
    steps:
      - name: Call cronEveningDigest
        env:
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          ADMIN_TOKEN: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          # Запасного пропуска в коде больше нет. Он тут был «чтобы не легло»,
          # но репозиторий открыт, и любой мог им обратиться к db.php — то есть
          # ко всем данным. Проверено: пропуск был действующим.
          #
          # Нет секрета — ход честно падает. Это видно сразу, в отличие от
          # тихой работы на ключе, который знает посторонний.
          if [ -z "$APP_SECRET" ]; then
            echo "Секрет EXPO_PUBLIC_APP_SECRET не задан"; exit 1
          fi
          SECRET="$APP_SECRET"
          RESP=$(curl -s -X POST "https://jobtoo.ru/api/db.php" \
            -H "Content-Type: application/json" \
            -H "X-App-Secret: $SECRET" \
            -d '{"fn":"cronEveningDigest","args":[]}')
          echo "Response: $RESP"
          echo "$RESP" | grep -q '"data"' || { echo "cronEveningDigest failed"; exit 1; }
