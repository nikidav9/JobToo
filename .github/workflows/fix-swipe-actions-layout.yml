name: Fix swipe actions layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-swipe-actions-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Check
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          git commit -m "fix: keep swipe actions above tab bar"
          git push origin HEAD:main
