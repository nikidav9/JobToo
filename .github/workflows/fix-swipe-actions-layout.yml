name: Fix swipe actions layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-swipe-actions-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch swipe controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/(tabs)/feed.tsx')
          s = p.read_text()

          old = "function WorkerFeed() {\n  const router = useRouter();"
          assert old in s
          s = s.replace(old, old + "\n  const tabBarHeight = useBottomTabBarHeight();", 1)

          old = '<View style={styles.shiftDeckActions} pointerEvents="box-none">'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '<View style={[styles.shiftDeckActions, { bottom: tabBarHeight + rs(18) }]} pointerEvents="box-none">', 1)

          pattern = re.compile(r'''\s*<TouchableOpacity\n\s*accessibilityLabel=\{'external' in currentCard \? 'Открыть у источника' : \(isCurrentSaved \? 'Убрать из избранного' : 'В избранное'\)\}\n\s*style=\{\[styles\.deckFloatingAction, styles\.deckFloatingChat\]\}\n\s*onPress=\{\(\) => \{ if \('external' in currentCard\) doMessageRef\.current\?\.\(\); else toggleSavedShift\(\); \}\}\n\s*activeOpacity=\{0\.75\}\n\s*>\n\s*<Ionicons\n\s*name=\{'external' in currentCard \? 'open-outline' : \(isCurrentSaved \? 'star' : 'star-outline'\)\}\n\s*size=\{24\}\n\s*color=\{'external' in currentCard \? Colors\.blue : \(isCurrentSaved \? Colors\.amber : Colors\.textSecondary\)\}\n\s*/>\n\s*</TouchableOpacity>''')
          repl = '''\n                <TouchableOpacity
                  accessibilityLabel={'external' in currentCard ? 'Открыть у источника' : 'Написать работодателю'}
                  style={[styles.deckFloatingAction, styles.deckFloatingChat]}
                  onPress={() => doMessageRef.current?.()}
                  activeOpacity={0.75}
                >
                  <Ionicons
                    name={'external' in currentCard ? 'open-outline' : 'chatbubble-outline'}
                    size={23}
                    color={Colors.blue}
                  />
                </TouchableOpacity>'''
          s, n = pattern.subn(repl, s, count=1)
          assert n == 1, n

          hint = '<Text style={styles.swipeHint}>← Свайпай →</Text>'
          assert s.count(hint) == 1, s.count(hint)
          hint_new = '''<View style={styles.swipeHintRow}>
                <Ionicons name="arrow-undo-outline" size={18} color={Colors.textMuted} />
                <Text style={styles.swipeHint}>Свайпай</Text>
                <Ionicons name="arrow-redo-outline" size={18} color={Colors.textMuted} />
              </View>'''
          s = s.replace(hint, hint_new, 1)

          old = '<View style={styles.deckFloatingActions} pointerEvents="box-none">'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '<View style={[styles.shiftDeckActions, { bottom: tabBarHeight + rs(18) }]} pointerEvents="box-none">\n          <View style={styles.shiftDeckRow}>', 1)

          marker = '''          <TouchableOpacity
            accessibilityLabel="Откликнуться на вакансию"
            style={[styles.deckFloatingAction, styles.deckFloatingWant]}
            onPress={() => swWant(0.5)}
            activeOpacity={0.75}
          >
            <Ionicons name="heart" size={29} color="#fff" />
          </TouchableOpacity>
        </View>
      </View>'''
          assert marker in s
          marker_new = '''          <TouchableOpacity
            accessibilityLabel="Откликнуться на вакансию"
            style={[styles.deckFloatingAction, styles.deckFloatingWant]}
            onPress={() => swWant(0.5)}
            activeOpacity={0.75}
          >
            <Ionicons name="heart" size={29} color="#fff" />
          </TouchableOpacity>
          </View>
          <View style={styles.swipeHintRow}>
            <Ionicons name="arrow-undo-outline" size={18} color={Colors.textMuted} />
            <Text style={styles.swipeHint}>Свайпай</Text>
            <Ionicons name="arrow-redo-outline" size={18} color={Colors.textMuted} />
          </View>
        </View>
      </View>'''
          s = s.replace(marker, marker_new, 1)

          old = "  swipeHint: { fontSize: rf(12), color: Colors.textMuted, fontWeight: '500' },"
          assert old in s
          new = "  swipeHintRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: rs(8) },\n" + old
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Check
        run: |
          git diff --check
          grep -q 'bottom: tabBarHeight + rs(18)' 'app/(tabs)/feed.tsx'
          grep -q 'chatbubble-outline' 'app/(tabs)/feed.tsx'
          grep -q 'swipeHintRow' 'app/(tabs)/feed.tsx'

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/feed.tsx'
          git commit -m "fix: keep swipe actions above tab bar"
          git push origin HEAD:main
