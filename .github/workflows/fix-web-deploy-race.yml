name: Fix web deploy race

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-web-deploy-race.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove CDN rewrite from primary deploy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-regru.yml')
          s = p.read_text()
          start = s.index('      # Статику — с Timeweb CDN, а не с одного нашего сервера.')
          end = s.index('      # Здесь же собирались файлы секретов для Reg.ru:', start)
          replacement = '''      # Статика остаётся на том же origin, что и HTML.\n      # Технический Timeweb CDN отключён: он отвечал 403 и делал свежую сборку\n      # недоступной, даже когда сам origin работал.\n      - name: Verify same-origin static assets\n        run: |\n          if grep -R "j8a6jds2at.cdn.twcstorage.ru" dist --include='*.html'; then\n            echo "Обнаружена ссылка на отключённый Timeweb CDN"\n            exit 1\n          fi\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check
          if grep -n "Point static assets at Timeweb CDN\|j8a6jds2at.cdn.twcstorage.ru" .github/workflows/deploy-regru.yml; then
            echo "CDN rewrite still present"
            exit 1
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-regru.yml
          git commit -m "fix: publish web build without broken CDN"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
