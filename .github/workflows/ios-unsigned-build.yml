name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-unsigned-build.yml']

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate ios project)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          EXPO_PUBLIC_DASHBOARD_URL: ${{ secrets.EXPO_PUBLIC_DASHBOARD_URL }}
        run: npx expo prebuild -p ios --no-install

      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          EXPO_PUBLIC_DASHBOARD_URL: ${{ secrets.EXPO_PUBLIC_DASHBOARD_URL }}
        run: |
          xcodebuild \
            -workspace ios/JobToo.xcworkspace \
            -scheme JobToo \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/JobToo.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tail -100

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/JobToo.xcarchive/Products/Applications/*.app Payload/
          zip -qry JobToo-unsigned.ipa Payload
          ls -la JobToo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JobToo-unsigned-ipa
          path: JobToo-unsigned.ipa
          retention-days: 30
