name: Supabase Keep-Alive

on:
  schedule:
    # Every 5 minutes — prevents Supabase free tier cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Стучимся через свой прокси, а не напрямую публичным ключом: после
      # закрытия базы тот получал бы отказ и грел бы воздух. Прокси ходит под
      # сервисным ключом, и dbWarmup делает настоящее чтение.
      - name: Ping Supabase
        env:
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          if [ -n "$APP_SECRET" ]; then
            SECRET="$APP_SECRET"; echo "Пропуск: из GitHub Secrets"
          else
            SECRET="ebb565bbbe600d111d88ad03b4d2e1731ebf9055d1dfd9bb147af91a6597d5f6"
            echo "Пропуск: запасной из кода — секрет EXPO_PUBLIC_APP_SECRET не задан"
          fi
          RESP=$(curl -s -m 20 -X POST "https://jobtoo.ru/api/db.php" \
            -H "Content-Type: application/json" \
            -H "X-App-Secret: $SECRET" \
            -d '{"fn":"dbWarmup","args":[]}')
          echo "$RESP" | grep -q '"data"' \
            && echo "База отвечает" \
            || { echo "Прогрев не прошёл: $RESP"; exit 1; }
