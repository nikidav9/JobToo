name: Полный импорт SuperJob

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    paths:
      - '.github/workflows/superjob-import.yml'
      - 'php-proxy/superjob.php'
      - 'php-proxy/ingest.php'
      - 'infra/superjob-import-loop.sh'

concurrency:
  group: superjob-full-import
  cancel-in-progress: false

jobs:
  import:
    name: Пройти каталог до последней страницы
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Import all SuperJob pages
        env:
          ADMIN_TOKEN: ${{ secrets.DASHBOARD_PASSWORD }}
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          if [ -z "$ADMIN_TOKEN" ] || [ -z "$APP_SECRET" ]; then
            echo "Секреты импорта не заданы"
            exit 1
          fi

          report_count() {
            count_file=$(mktemp)
            curl -fsS --max-time 30 -o "$count_file" \
              -H "X-App-Secret: $APP_SECRET" \
              -H 'Content-Type: application/json' \
              --data '{"fn":"extVacancyCount","args":[{"sources":["superjob"]}]}' \
              'https://jobtoo.ru/api/db.php'
            python3 - "$count_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              payload = json.load(fh)
          print(f"Активных уникальных вакансий SuperJob: {int(payload.get('data', 0))}")
          PY
            rm -f "$count_file"
          }

          for batch in $(seq 1 100); do
            response=$(mktemp)
            code=$(curl -sS --max-time 180 -o "$response" -w '%{http_code}' \
              --config - 'https://jobtoo.ru/api/ingest.php?source=superjob&force=1' <<CURL_CONFIG
          header = "X-Admin-Token: $ADMIN_TOKEN"
          CURL_CONFIG
            )
            if [ "$code" != 200 ]; then
              echo "Импорт вернул HTTP $code"
              sed -E 's/[[:cntrl:]]//g' "$response" | cut -c1-500
              exit 1
            fi

            state=$(python3 - "$response" "$batch" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              payload = json.load(fh)
          runs = payload.get('run')
          if payload.get('ok') is not True or not isinstance(runs, list) or len(runs) != 1:
              raise SystemExit('invalid ingest response')
          status = runs[0].get('status', '')
          print(f"batch={sys.argv[2]} status={status}", file=sys.stderr)
          if status.startswith('ок:'):
              print('complete')
          elif 'источник уже обрабатывается' in status:
              print('busy')
          elif status.startswith('продолжение:'):
              print('pending')
          else:
              print('error')
          PY
            )
            rm -f "$response"

            if [ "$state" = complete ]; then report_count; exit 0; fi
            if [ "$state" = busy ]; then report_count; exit 0; fi
            [ "$state" = pending ] || exit 1
            sleep 2
          done

          echo "Каталог не завершился за 100 порций"
          exit 1
