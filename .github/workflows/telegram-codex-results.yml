name: Результаты Codex в рабочую Telegram-группу

on:
  issue_comment:
    types: [created]

jobs:
  notify:
    if: >-
      ${{ github.event.issue.pull_request &&
          github.event.issue.number == 62 &&
          contains(github.event.comment.body || '', '<!-- jobtoo-codex-result') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Codex result to the originating Telegram topic
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as fh:
              event = json.load(fh)

          comment = (event['comment'].get('body') or '').strip()
          match = re.search(
              r'<!-- jobtoo-codex-result chat=(-?\d+) thread=(\d+) message=(\d+) -->',
              comment,
          )
          if not match:
              raise SystemExit('Telegram marker is missing')

          chat_id, thread_id, _ = map(int, match.groups())
          comment = re.sub(r'\n*<!-- jobtoo-codex-result.*?-->\s*$', '', comment, flags=re.S).strip()
          if len(comment) > 3300:
              comment = comment[:3300] + '…'
          text = f"✅ Codex: готово\n\n{comment}"
          payload = {'chat_id': chat_id, 'text': text, 'disable_web_page_preview': True}
          if thread_id > 0:
              payload['message_thread_id'] = thread_id

          token = os.environ.get('TG_BOT_TOKEN', '')
          if not token:
              raise SystemExit('TG_BOT_TOKEN is missing')
          data = json.dumps(payload, ensure_ascii=False).encode()
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              answer = json.load(response)
          if not answer.get('ok'):
              raise SystemExit(str(answer))
          print(f"Telegram message {answer['result']['message_id']} sent")
          PY
