name: Проверка и настройка DNS в Timeweb

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/timeweb-dns.yml
      - infra/timeweb-dns.py
  workflow_dispatch:

concurrency:
  group: timeweb-dns-jobtoo-ru
  cancel-in-progress: false

jobs:
  configure:
    name: Привести jobtoo.ru к конфигурации проекта
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Проверить наличие токена
        env:
          TW_TOKEN: ${{ secrets.TW_TOKEN }}
        run: |
          if [ -z "$TW_TOKEN" ]; then
            echo 'Секрет TW_TOKEN не задан в Settings → Secrets and variables → Actions.' >&2
            exit 1
          fi
          echo "TW_TOKEN задан (${#TW_TOKEN} символов); значение не выводится."

      - name: Настроить и повторно проверить DNS-зону
        env:
          TW_TOKEN: ${{ secrets.TW_TOKEN }}
        run: python3 infra/timeweb-dns.py записи
