# jobtoo.ru — сам сайт.
#
# Подставляется поверх остального только когда сертификат на домен уже
# выпущен: без него блок на 443 не поднимется, а перенаправление с 80 вело
# бы в никуда.
#
# До смены записи в DNS этот блок отвечает только тем, кто пришёл на адрес
# сервера с заголовком Host: jobtoo.ru, — то есть мне при проверке. Живые
# посетители всё это время идут на Reg.ru и ничего не замечают.

server {
    listen 80;
    # И по IPv6 тоже: у сервера он есть, и запись AAAA у домена указывает
    # на него. Без этой строки те, у кого IPv6 работает, — а в мобильных
    # сетях это половина — упирались бы в закрытую дверь, тогда как у
    # остальных всё открывается. Худший вид поломки: у соседа работает.
    listen [::]:80;
    server_name jobtoo.ru www.jobtoo.ru;

    # До TLS и раньше всего остального: сюда приходит продление сертификата.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://jobtoo.ru$request_uri; }
}

server {
    # http2 намеренно не повторяем: в этой версии nginx это настройка самого
    # слушающего сокета, заданная в блоке выше, а не свойство сайта.
    # Повторное упоминание даёт предупреждение о переопределении.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobtoo.ru www.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;   # голосовые и фото из чатов

    # Имя одно. Иначе приложение, метрика и куки живут в двух разных
    # источниках, а пользователь этого не видит.
    if ($host = www.jobtoo.ru) { return 301 https://jobtoo.ru$request_uri; }

    root /var/www/jobtoo;
    index index.html;

    # PHP-прокси: /api/db.php, /api/tg.php, /api/admin.php, /api/tgtool.php.
    # Ровно те же адреса, что сейчас на хостинге, — в этом весь смысл переноса
    # домена: в приложении не меняется ни строки, вебхук бота остаётся прежним.
    # Внешнее API. Отдельным адресом и до общего правила для .php: партнёр
    # ходит по /api/v1/vacancies, а не по имени файла, — так внутреннее
    # устройство не становится частью договора.
    location ~ ^/api/v1/(.*)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/api.php;
        fastcgi_param SCRIPT_NAME /api/v1;
        fastcgi_param PATH_INFO /$1;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    location ~ ^/api/(.+\.php)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/$1;
        fastcgi_param SCRIPT_NAME /api/$1;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Данные и файлы — те же пути, что у временного имени <адрес>.sslip.io.
    # Пока приложение ходит по нему, но теперь есть куда переехать и им,
    # чтобы адрес из IP исчез отовсюду.
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # См. nginx-tls.conf: служебные вызовы Realtime идут не в /socket/.
    location /realtime/v1/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host realtime-dev.localhost;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Арендатора Realtime ищет по первой части имени хоста — см. nginx-tls.conf.
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # То же, что делал .htaccess на хостинге: страницу-оболочку не кэшируем,
    # иначе после выкладки люди неделями сидят на старой сборке.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Приложение одностраничное: любой путь отдаёт оболочку, разбирается она сама.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Панель базы — на отдельном порту и в корне.
#
# Под путём /studio/ она не работала: это приложение Next.js, оно ждёт себя
# в корне и запрашивает ресурсы по /_next/..., мимо любого префикса. Проще
# дать ей собственный порт, чем переписывать половину путей.
#
# Здесь, а не рядом с временным именем: адрес из цифр убран отовсюду, и
# панель была последним местом, где он оставался.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name jobtoo.ru www.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # За паролем: панель показывает переписку и телефоны 420 человек.
    auth_basic "JobToo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 60m;

    # Значения для настроек репозитория. Здесь, а не на общем порту: эта
    # часть за паролем, а status.json открыт всем.
    location = /token.txt {
        alias /var/www/private/token.txt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
