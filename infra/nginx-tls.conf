# Защищённая часть. Подставляется поверх основной, когда сертификат выпущен.
#
# Отдельным файлом, а не правкой certbot: bootstrap переписывает конфигурацию
# каждую минуту и стирал всё, что certbot туда вносил. Сертификат был, а
# отдавать его было некому — TLS-рукопожатие обрывалось.
#
# __HOST__ подставляется при разворачивании.

server {
    listen 443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /status.json { root /var/www/html; default_type application/json; }
    location = /apply.log   { alias /var/log/jt-apply.log; default_type text/plain; charset utf-8; }
    location = / { return 200 'JobToo backend\n'; default_type text/plain; }
}

# Панель — на отдельном порту и в корне.
#
# Под путём /studio/ она не работала: это приложение Next.js, оно ждёт себя
# в корне и запрашивает ресурсы по /_next/..., мимо любого префикса. Проще
# дать ей собственный порт, чем переписывать половину путей.
server {
    listen 8443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # За паролем: панель показывает переписку и телефоны 420 человек.
    auth_basic "JobToo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
