# Шлюз: снаружи один адрес, внутри — разные службы.
#
# Пути повторяют облачный Supabase один в один. Это и есть главная выгода
# всей затеи: в приложении меняется только адрес, а /rest/v1/... остаётся
# тем же, и ни одна строчка в services/db.ts не трогается.
#
# TLS сюда допишет certbot при первом выпуске сертификата.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 60m;   # голосовые и фото из чатов

    # Данные: сюда ходят php-proxy и дашборд
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живые обновления. Нужен апгрейд до вебсокета — без этих двух заголовков
    # подписки молча не работают, а выглядит это как «чаты не обновляются».
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Аватары, фото и голосовые
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка владения именем при выпуске сертификата. Должна работать
    # по http, до всякого TLS, иначе сертификат не получить.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Полный журнал последнего захода. Открыт на чтение намеренно: ssh
    # недоступен, и без этого причина поломки остаётся на машине. Секретов
    # там нет — только шаги установки и журналы служб.
    location = /apply.log {
        alias /var/log/jt-apply.log;
        default_type text/plain;
        charset utf-8;
    }

    # Страница состояния — по ней я снаружи вижу, что происходит
    location = /status.json {
        root /var/www/html;
        add_header Content-Type application/json;
    }

    location = / {
        return 200 'JobToo backend\n';
        add_header Content-Type text/plain;
    }
}
