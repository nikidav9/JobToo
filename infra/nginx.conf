# Шлюз: снаружи один адрес, внутри — разные службы.
#
# Пути повторяют облачный Supabase один в один. Это и есть главная выгода
# всей затеи: в приложении меняется только адрес, а /rest/v1/... остаётся
# тем же, и ни одна строчка в services/db.ts не трогается.
#
# TLS сюда допишет certbot при первом выпуске сертификата.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 60m;   # голосовые и фото из чатов

    # Данные: сюда ходят php-proxy и дашборд
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живые обновления. Нужен апгрейд до вебсокета — без этих двух заголовков
    # подписки молча не работают, а выглядит это как «чаты не обновляются».
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # См. комментарий в nginx-tls.conf: Realtime ищет арендатора по имени хоста.
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 3600s;
    }

    # Аватары, фото и голосовые
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка владения именем при выпуске сертификата. Должна работать
    # по http, до всякого TLS, иначе сертификат не получить.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Наружу отдаём только минимальный сигнал доступности. Подробные
    # отчёты остаются локальными на сервере.
    location = /health {
        default_type application/json;
        return 200 '{"ok":true}\n';
    }
    location = /status.json { return 404; }
    location = /health-history.ndjson { return 404; }
    location = /apply.log { return 404; }

    location = / {
        return 200 'JobToo backend\n';
        add_header Content-Type text/plain;
    }
}

# Сайт под отдельным именем — чтобы проверить его до переезда домена.
#
# Иначе первый настоящий запрос к веб-версии на этом сервере случился бы
# ровно в момент смены записи в DNS, когда проверять уже поздно. Имя
# site.<адрес>.sslip.io указывает сюда всегда и ни с чем не спорит.
#
# Тот же корень и те же правила, что в блоке для jobtoo.ru: проверка имеет
# смысл, только если проверяется то же самое.
server {
    listen 80;
    listen [::]:80;
    server_name site.147.45.184.99.sslip.io;

    root /var/www/jobtoo;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    location ~ ^/api/(.+\.php)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/$1;
        fastcgi_param SCRIPT_NAME /api/$1;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ^~ /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
